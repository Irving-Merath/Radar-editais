name: Coleta semanal de editais
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 6h no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - run: python -u .diag/diag.py 'https://bidlab.org/en/calls-for-proposals' 'https://bidlab.org/es/convocatorias' 'https://solve.mit.edu/challenges' 'https://gcgh.grandchallenges.org/grant-opportunities' 'https://www.grandchallenges.org/' 'https://www.xprize.org/prizes' 'https://wellcome.org/research-funding/schemes' 'https://www.caf.com/es/convocatorias/' 'https://www.ukri.org/opportunity/' 'https://startup.google.com/programs/' 'https://www.idrc-crdi.ca/en/funding' 'https://www.fundsforngos.org/' 'https://www.unido.org/' 'https://eic.ec.europa.eu/eic-funding-opportunities_en' 'https://www.euraxess.org.br/' 'https://www.daad.org.br/pt/' 'https://www.campusfrance.org/pt' 'https://www.gov.uk/international-development-funding' 'https://www.iadb.org/en/how-we-can-work-together/calls-for-proposals' 'https://www.worldbank.org/en/programs/development-marketplace'
