name: Coleta semanal de editais
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 6h no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - run: python -u .diag/pncp.py
