name: Coleta semanal de editais
on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 6h no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python -u .diag/diag.py 'https://www.faperj.br/?id=76.5.3' 'https://www.faperj.br/?id=1141.7.9' 'https://www.faperj.br/?id=1042.7.7' 'https://www.faperj.br/?id=1118.7.8' 'http://www.finep.gov.br/chamadas-publicas?situacao=aberta' 'https://www.finep.gov.br/oportunidades' 'https://fapemig.br/oportunidades/chamadas-e-editais?status=aberta' 'https://prosas.com.br/editais' 'https://www.bndes.gov.br/wps/portal/site/home/onde-atuamos/inovacao' 'https://programacentelha.com.br/' 'https://inovativa.online/' 'https://www.gov.br/mcti/pt-br/acompanhe-o-mcti/editais' 'https://www.firjan.com.br/senai/inovacao/' 'https://prefeitura.rio/' 'https://www.gov.br/finep/pt-br' 'https://news.google.com/rss/search?q=edital+inova%C3%A7%C3%A3o+Rio+de+Janeiro&hl=pt-BR&gl=BR&ceid=BR:pt-419'
